        .container { background: rgba(255, 255, 255, 0.1); backdrop-filter: blur(10px); border-radius: 15px; border: 1px solid rgba(255, 255, 255, 0.2); width: 100%; max-width: 400px; padding: 25px; box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37); margin: auto; }

        button { width: 100%; padding: 12px; background: #00d2ff; border: none; border-radius: 8px; color: #000; font-weight: bold; font-size: 16px; cursor: pointer; margin-top: 10px; transition: 0.3s; }
        button:hover { background: #3a7bd5; color: white; }

        .back-btn:hover { color: white; }

        /* Ad Container */
        .ad-container { margin: 20px auto; background: white; width: 300px; height: 250px; display: flex; justify-content: center; align-items: center; border-radius: 8px; overflow: hidden; box-shadow: 0 4px 15px rgba(0,0,0,0.3); }

        /* Footer */
        footer { text-align: center; padding: 15px; font-size: 12px; color: #ddd; border-top: 1px solid rgba(255,255,255,0.2); width: 100%; margin-top: auto; }
        footer span { color: #f39c12; font-weight: bold; }

</head>
<body>
    <div class="container">
        <div class="logo-container">
            <img src="https://i.ibb.co/fdKdZ5p5/file-00000000e05882109418c5b27f912c06.png" alt="Money Hunt Logo">
        </div>
        <h2>💰 Deposit Funds</h2>
        
        <!-- Admin Payment Details -->
        <div class="payment-info">
            <h4>Easypaisa / JazzCash</h4>
            <p><strong>Account Name:</strong> Wahid</p>
            <p><strong>Account Number:</strong> 03325191774</p>
            <p style="color: #ff9f43; margin-top: 5px; font-size: 12px;">*Minimum deposit is Rs 150. Send money and enter details below.</p>
        </div>

        <div class="form-group"><label>Amount (Min: Rs 150)</label><input type="number" id="depAmount" placeholder="Enter Amount" min="150"></div>
        <div class="form-group"><label>Payment Method</label><select id="depMethod"><option value="Easypaisa">Easypaisa</option><option value="Jazzcash">JazzCash</option></select></div>
        <div class="form-group"><label>Sender Account Name / Number</label><input type="text" id="depSender" placeholder="Jis account سے paise bheje hain"></div>
        <div class="form-group"><label>Transaction ID (TID)</label><input type="text" id="depTid" placeholder="Enter 11-digit TID"></div>

        <button onclick="submitDeposit()" id="submitBtn">Submit Request</button>

    <!-- Firebase Script -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";
        import { getFirestore, collection, addDoc, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

        const firebaseConfig = { apiKey: "AIzaSyDsUZ9ovtUP818EwaTs1PjRRpANgyGb68w", authDomain: "earningapp-a6d67.firebaseapp.com", projectId: "earningapp-a6d67", storageBucket: "earningapp-a6d67.firebasestorage.app", messagingSenderId: "818725738178", appId: "1:818725738178:web:fb7e491248a35a2e960d5b" };
        const app = initializeApp(firebaseConfig); const auth = getAuth(app); const db = getFirestore(app);
        const msgBox = document.getElementById('message'); const submitBtn = document.getElementById('submitBtn');
        let currentUser = null;

        onAuthStateChanged(auth, (user) => { if (user) { currentUser = user; } else { window.location.href = "index.html"; } });

        window.submitDeposit = async function() {
            const amount = parseInt(document.getElementById('depAmount').value);
            const method = document.getElementById('depMethod').value;
            const sender = document.getElementById('depSender').value;
            const tid = document.getElementById('depTid').value;

            if (!amount || !sender || !tid) { msgBox.style.color = "red"; msgBox.innerText = "Please fill all fields!"; return; }
            if (amount < 150) { msgBox.style.color = "red"; msgBox.innerText = "Minimum deposit is Rs 150!"; return; }

            try {
                submitBtn.innerText = "Submitting..."; submitBtn.disabled = true; msgBox.innerText = "";
                await addDoc(collection(db, "Deposits"), { uid: currentUser.uid, amount: amount, method: method, senderDetails: sender, transactionId: tid, status: "Pending", timestamp: serverTimestamp() });
                msgBox.style.color = "#00ff00"; msgBox.innerText = "Deposit Request Sent Successfully!";
                document.getElementById('depAmount').value = ""; document.getElementById('depSender').value = ""; document.getElementById('depTid').value = "";
                setTimeout(() => { submitBtn.innerText = "Submit Request"; submitBtn.disabled = false; }, 2000);
            } catch (error) {
                msgBox.style.color = "red"; msgBox.innerText = "Error: " + error.message;
                submitBtn.innerText = "Submit Request"; submitBtn.disabled = false;
            }
        };
    </script>
</body>
