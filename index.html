<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Money Hunt - Login / Register</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        
        body { 
            background: linear-gradient(135deg, #FF416C 0%, #FF4B2B 35%, #8A2387 70%, #E94057 100%); 
            background-size: 400% 400%;
            animation: gradientBG 12s ease infinite;
            min-height: 100vh; 
            padding: 20px; 
            display: flex; 
            flex-direction: column; 
            align-items: center; 
            justify-content: space-between; 
            color: white; 
        }

        @keyframes gradientBG {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }
        
        .main-wrapper { width: 100%; max-width: 400px; display: flex; flex-direction: column; align-items: center; margin: auto; }

        /* Logo Styling */
        .logo-container { text-align: center; margin-bottom: 15px; animation: fadeInDown 0.8s ease; }
        .logo-container img { width: 80px; height: 80px; border-radius: 50%; border: 3px solid #FFD700; object-fit: cover; box-shadow: 0 0 20px rgba(255, 215, 0, 0.8); }

        /* Colorful Glassmorphism Card Container */
        .container { 
            background: rgba(255, 255, 255, 0.12); 
            backdrop-filter: blur(15px); 
            -webkit-backdrop-filter: blur(15px); 
            border-radius: 24px; 
            border: 1px solid rgba(255, 255, 255, 0.3); 
            width: 100%; 
            padding: 30px; 
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.4); 
            animation: fadeInUp 0.8s ease; 
        }
        
        h2 { text-align: center; margin-bottom: 5px; color: #FFD700; font-size: 28px; font-weight: 800; text-shadow: 0 2px 10px rgba(0,0,0,0.2); }
        .subtitle { text-align: center; font-size: 13px; color: #f1f1f1; margin-bottom: 25px; font-weight: 500; }

        .form-group { margin-bottom: 18px; position: relative; }
        .form-group label { display: block; margin-bottom: 6px; font-size: 13px; font-weight: 600; color: #fff; }
        .form-group input { width: 100%; padding: 12px 16px; border-radius: 12px; border: 1px solid rgba(255, 255, 255, 0.4); outline: none; background: rgba(0, 0, 0, 0.25); color: white; font-size: 14px; transition: 0.3s; }
        .form-group input::placeholder { color: #ddd; }
        .form-group input:focus { border-color: #FFD700; background: rgba(0, 0, 0, 0.4); box-shadow: 0 0 15px rgba(255, 215, 0, 0.5); }
        
        /* Vibrant Colorful Button */
        .action-btn { 
            width: 100%; 
            padding: 14px; 
            background: linear-gradient(135deg, #FDC830 0%, #F37335 100%); 
            border: none; 
            border-radius: 12px; 
            color: #fff; 
            font-weight: bold; 
            font-size: 16px; 
            cursor: pointer; 
            margin-top: 10px; 
            transition: 0.3s; 
            box-shadow: 0 5px 20px rgba(243, 115, 53, 0.5); 
            text-transform: uppercase;
            letter-spacing: 1px;
        }
        .action-btn:hover { 
            background: linear-gradient(135deg, #F37335 0%, #FDC830 100%); 
            transform: translateY(-2px); 
            box-shadow: 0 8px 25px rgba(243, 115, 53, 0.8); 
        }
        .action-btn:active { transform: translateY(1px); }

        .switch-text { text-align: center; margin-top: 20px; font-size: 13px; color: #f1f1f1; }
        .switch-text span { color: #FFD700; cursor: pointer; font-weight: bold; text-decoration: underline; }
        .switch-text span:hover { color: #fff; }
        
        #message { text-align: center; margin-top: 15px; font-weight: bold; font-size: 13px; min-height: 20px; text-shadow: 0 1px 3px rgba(0,0,0,0.5); }

        /* Animations */
        @keyframes fadeInDown {
            from { opacity: 0; transform: translateY(-20px); }
            to { opacity: 1; transform: translateY(0); }
        }
        @keyframes fadeInUp {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* Modern Floating Glass Footer */
        footer { 
            text-align: center; 
            padding: 12px 20px; 
            font-size: 12px; 
            color: #fff; 
            background: rgba(0, 0, 0, 0.25);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border-radius: 15px;
            border: 1px solid rgba(255, 255, 255, 0.2);
            width: 100%; 
            max-width: 400px;
            margin-top: 25px; 
            box-shadow: 0 5px 15px rgba(0,0,0,0.2);
        }
        footer p { margin: 3px 0; }
        footer span { color: #FFD700; font-weight: bold; }
    </style>
</head>
<body>

    <div class="main-wrapper">
        <!-- Logo -->
        <div class="logo-container">
            <img src="https://i.ibb.co/fdKdZ5p5/file-00000000e05882109418c5b27f912c06.png" alt="Money Hunt Logo">
        </div>

        <div class="container">
            <h2 id="formTitle">Welcome Back</h2>
            <p class="subtitle" id="formSubtitle">Login to your Money Hunt account</p>

            <div class="form-group" id="nameGroup" style="display: none;">
                <label>Full Name</label>
                <input type="text" id="fullName" placeholder="Enter your name">
            </div>

            <div class="form-group">
                <label>Email Address</label>
                <input type="email" id="email" placeholder="Enter your email">
            </div>

            <div class="form-group">
                <label>Password</label>
                <input type="password" id="password" placeholder="Enter your password">
            </div>

            <button class="action-btn" id="submitBtn" onclick="handleAuth()">Login</button>
            <p id="message"></p>

            <div class="switch-text" id="switchContainer">
                Don't have an account? <span onclick="toggleMode()">Register Now</span>
            </div>
        </div>

        <!-- Modern Floating Glass Footer -->
        <footer>
            <p>&copy; 2026 <span>Money Hunt</span>. All Rights Reserved.</p>
            <p>Developed with ❤️ by <span>HAMEED ULLAH</span></p>
        </footer>
    </div>

    <!-- Adsterra Social Bar Code -->
    <script type="text/javascript" src="https://pl31060723.profitableratecpmnetwork.com/03/a0/73/03a073df3a084f10e47376af631fded4.js"></script>

    <!-- Firebase Script -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getAuth, signInWithEmailAndPassword, createUserWithEmailAndPassword, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";
        import { getFirestore, doc, setDoc, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

        const firebaseConfig = { apiKey: "AIzaSyDsUZ9ovtUP818EwaTs1PjRRpANgyGb68w", authDomain: "earningapp-a6d67.firebaseapp.com", projectId: "earnowingapp-a6d67", storageBucket: "earningapp-a6d67.firebasestorage.app", messagingSenderId: "818725738178", appId: "1:818725738178:web:fb7e491248a35a2e960d5b" };
        // Note: keeping exact original config values from your project
        const correctedFirebaseConfig = { apiKey: "AIzaSyDsUZ9ovtUP818EwaTs1PjRRpANgyGb68w", authDomain: "earningapp-a6d67.firebaseapp.com", projectId: "earningapp-a6d67", storageBucket: "earningapp-a6d67.firebasestorage.app", messagingSenderId: "818725738178", appId: "1:818725738178:web:fb7e491248a35a2e960d5b" };

        const app = initializeApp(correctedFirebaseConfig); 
        const auth = getAuth(app); 
        const db = getFirestore(app);

        let isLoginMode = true;
        const msgBox = document.getElementById('message');
        const submitBtn = document.getElementById('submitBtn');

        // Check if user already logged in, redirect to dashboard
        onAuthStateChanged(auth, (user) => {
            if (user) {
                window.location.href = "dashboard.html";
            }
        });

        window.toggleMode = function() {
            isLoginMode = !isLoginMode;
            const formTitle = document.getElementById('formTitle');
            const formSubtitle = document.getElementById('formSubtitle');
            const nameGroup = document.getElementById('nameGroup');
            const switchContainer = document.getElementById('switchContainer');

            if (isLoginMode) {
                formTitle.innerText = "Welcome Back";
                formSubtitle.innerText = "Login to your Money Hunt account";
                nameGroup.style.display = "none";
                submitBtn.innerText = "Login";
                switchContainer.innerHTML = `Don't have an account? <span onclick="toggleMode()">Register Now</span>`;
            } else {
                formTitle.innerText = "Create Account";
                formSubtitle.innerText = "Join Money Hunt & Start Earning";
                nameGroup.style.display = "block";
                submitBtn.innerText = "Register";
                switchContainer.innerHTML = `Already have an account? <span onclick="toggleMode()">Login Here</span>`;
            }
            msgBox.innerText = "";
        };

        window.handleAuth = async function() {
            const email = document.getElementById('email').value.trim();
            const password = document.getElementById('password').value.trim();
            const name = document.getElementById('fullName').value.trim();

            if (!email || !password || (!isLoginMode && !name)) {
                msgBox.style.color = "#FFD700";
                msgBox.innerText = "Please fill in all fields!";
                return;
            }

            try {
                submitBtn.innerText = "Please wait...";
                submitBtn.disabled = true;
                msgBox.innerText = "";

                if (isLoginMode) {
                    // Login
                    await signInWithEmailAndPassword(auth, email, password);
                } else {
                    // Register
                    const userCredential = await createUserWithEmailAndPassword(auth, email, password);
                    const user = userCredential.user;

                    // Create user document in Firestore with starting balance 0
                    await setDoc(doc(db, "Users", user.uid), {
                        uid: user.uid,
                        name: name,
                        email: email,
                        balance: 0,
                        createdAt: serverTimestamp()
                    });
                }
            } catch (error) {
                msgBox.style.color = "#FFD700";
                msgBox.innerText = error.message.replace("Firebase: ", "");
                submitBtn.innerText = isLoginMode ? "Login" : "Register";
                submitBtn.disabled = false;
            }
        };
    </script>
</body>
</html>
