<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Money Hunt - Welcome</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background: linear-gradient(135deg, #1e3c72 0%, #2a5298 100%); min-height: 100vh; display: flex; flex-direction: column; justify-content: space-between; align-items: center; padding: 20px; }
        .container { background: rgba(255, 255, 255, 0.1); backdrop-filter: blur(10px); border-radius: 15px; border: 1px solid rgba(255, 255, 255, 0.2); width: 100%; max-width: 400px; padding: 30px; color: white; box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37); margin: auto; }
        .tabs { display: flex; margin-bottom: 20px; border-bottom: 1px solid rgba(255,255,255,0.3); }
        .tab { flex: 1; text-align: center; padding: 10px; cursor: pointer; font-weight: bold; transition: 0.3s; }
        .tab.active { border-bottom: 3px solid #00d2ff; color: #00d2ff; }
        .form-group { margin-bottom: 15px; }
        .form-group label { display: block; margin-bottom: 5px; font-size: 14px; }
        .form-group input { width: 100%; padding: 10px; border-radius: 8px; border: none; outline: none; background: rgba(255, 255, 255, 0.9); color: #333; }
        button { width: 100%; padding: 12px; background: #00d2ff; border: none; border-radius: 8px; color: #000; font-weight: bold; font-size: 16px; cursor: pointer; margin-top: 10px; transition: 0.3s; }
        button:hover { background: #3a7bd5; color: white; }
        .hidden { display: none; }
        #message { text-align: center; margin-top: 15px; font-weight: bold; font-size: 14px; }
        
        /* Footer */
        footer { text-align: center; padding: 15px; font-size: 12px; color: #ddd; border-top: 1px solid rgba(255,255,255,0.2); width: 100%; margin-top: auto; }
        footer span { color: #f39c12; font-weight: bold; }
    </style>
</head>
<body>

    <div class="container">
        <h2 style="text-align: center; margin-bottom: 15px; color: #f39c12;">🎯 Money Hunt</h2>
        <div class="tabs">
            <div class="tab active" onclick="switchTab('login')">Login</div>
            <div class="tab" onclick="switchTab('register')">Register</div>
        </div>

        <!-- Login Form -->
        <div id="loginForm">
            <h3 style="text-align: center; margin-bottom: 20px;">Welcome Back!</h3>
            <div class="form-group"><label>Email Address</label><input type="email" id="loginEmail" placeholder="Enter your email"></div>
            <div class="form-group"><label>Password</label><input type="password" id="loginPassword" placeholder="Enter your password"></div>
            <button onclick="loginUser()">Login</button>
        </div>

        <!-- Register Form -->
        <div id="registerForm" class="hidden">
            <h3 style="text-align: center; margin-bottom: 20px;">Create Account</h3>
            <div class="form-group"><label>Full Name</label><input type="text" id="regName" placeholder="Enter your name"></div>
            <div class="form-group"><label>WhatsApp Number</label><input type="number" id="regPhone" placeholder="Enter WhatsApp number"></div>
            <div class="form-group"><label>Email Address</label><input type="email" id="regEmail" placeholder="Enter your email"></div>
            <div class="form-group"><label>Password</label><input type="password" id="regPassword" placeholder="Create a password"></div>
            <button onclick="registerUser()">Register</button>
        </div>
        
        <p id="message"></p>
    </div>

    <!-- Footer -->
    <footer>
        <p>&copy; 2026 <span>Money Hunt</span>. All Rights Reserved.</p>
        <p>Developed by <span>HAMEED ULLAH</span></p>
    </footer>

    <!-- UI Script -->
    <script>
        function switchTab(tab) {
            document.getElementById('loginForm').classList.toggle('hidden', tab !== 'login');
            document.getElementById('registerForm').classList.toggle('hidden', tab !== 'register');
            document.querySelectorAll('.tab')[0].classList.toggle('active', tab === 'login');
            document.querySelectorAll('.tab')[1].classList.toggle('active', tab === 'register');
            document.getElementById('message').innerText = "";
        }
    </script>

    <!-- Firebase Script -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getAuth, createUserWithEmailAndPassword, signInWithEmailAndPassword } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";
        import { getFirestore, doc, setDoc } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyDsUZ9ovtUP818EwaTs1PjRRpANgyGb68w",
            authDomain: "earningapp-a6d67.firebaseapp.com",
            projectId: "earningapp-a6d67",
            storageBucket: "earningapp-a6d67.firebasestorage.app",
            messagingSenderId: "818725738178",
            appId: "1:818725738178:web:fb7e491248a35a2e960d5b"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);
        const msgBox = document.getElementById('message');

        window.registerUser = async function() {
            const name = document.getElementById('regName').value;
            const phone = document.getElementById('regPhone').value;
            const email = document.getElementById('regEmail').value;
            const password = document.getElementById('regPassword').value;

            if(!name || !phone || !email || !password) {
                msgBox.style.color = "red";
                msgBox.innerText = "Please fill all fields!";
                return;
            }

            try {
                msgBox.style.color = "white";
                msgBox.innerText = "Creating account...";
                
                const userCredential = await createUserWithEmailAndPassword(auth, email, password);
                const user = userCredential.user;

                await setDoc(doc(db, "Users", user.uid), {
                    name: name,
                    phone: phone,
                    email: email,
                    balance: 0,
                    role: "user",
                    uid: user.uid
                });

                msgBox.style.color = "#00ff00";
                msgBox.innerText = "Account Created Successfully! Redirecting...";
                
                setTimeout(() => { window.location.href = "dashboard.html"; }, 2000);
            } catch (error) {
                msgBox.style.color = "red";
                msgBox.innerText = error.message;
            }
        };

        window.loginUser = async function() {
            const email = document.getElementById('loginEmail').value;
            const password = document.getElementById('loginPassword').value;

            if(!email || !password) {
                msgBox.style.color = "red";
                msgBox.innerText = "Please enter email and password!";
                return;
            }

            try {
                msgBox.style.color = "white";
                msgBox.innerText = "Logging in...";
                await signInWithEmailAndPassword(auth, email, password);
                
                msgBox.style.color = "#00ff00";
                msgBox.innerText = "Login Successful! Redirecting...";
                
                setTimeout(() => { window.location.href = "dashboard.html"; }, 2000);
            } catch (error) {
                msgBox.style.color = "red";
                msgBox.innerText = "Invalid Email or Password!";
            }
        };
    </script>
</body>
</html>
